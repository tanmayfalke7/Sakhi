<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PCOS Chatbot Tester</title>
    <style>
        /* --- CSS STYLING --- */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f3f4f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .chat-container {
            width: 100%;
            max-width: 500px;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            height: 80vh;
            overflow: hidden;
        }
        .chat-header {
            background: #ff758c;
            color: white;
            padding: 16px;
            text-align: center;
            font-weight: bold;
            font-size: 1.2rem;
        }
        .chat-history {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background-color: #fafafa;
        }
        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 16px;
            line-height: 1.4;
            font-size: 0.95rem;
            word-wrap: break-word;
        }
        .message.user {
            background: #007bff;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }
        .message.bot {
            background: #e9ecef;
            color: #333;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }
        /* --- IMAGE STYLING --- */
        .bot-image {
            width: 100%;
            border-radius: 8px;
            margin-top: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            object-fit: cover;
            max-height: 250px;
        }
        .input-area {
            display: flex;
            padding: 12px;
            background: white;
            border-top: 1px solid #eee;
        }
        input {
            flex: 1;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 24px;
            outline: none;
            font-size: 1rem;
        }
        button {
            background: #ff758c;
            color: white;
            border: none;
            padding: 0 20px;
            margin-left: 8px;
            border-radius: 24px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }
        button:hover {
            background: #ff5e78;
        }
        .loading {
            align-self: flex-start;
            color: #888;
            font-size: 0.85rem;
            font-style: italic;
            display: none;
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <div class="chat-header">Glow - PCOS Assistant ✨</div>
        
        <div class="chat-history" id="chatHistory">
            <div class="message bot">Hey gorgeous! How can I help you support your body today? 💕</div>
        </div>
        
        <div class="loading" id="loadingIndicator">Glow is typing...</div>

        <div class="input-area">
            <input type="text" id="userInput" placeholder="Ask about symptoms, meals, etc..." onkeypress="handleEnter(event)">
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        // --- JAVASCRIPT LOGIC ---
        
        const chatHistory = document.getElementById('chatHistory');
        const userInput = document.getElementById('userInput');
        const loadingIndicator = document.getElementById('loadingIndicator');

        // Allow pressing 'Enter' to send
        function handleEnter(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            // 1. Display User Message
            appendMessage(text, 'user');
            userInput.value = '';
            
            // Show loading
            loadingIndicator.style.display = 'block';
            chatHistory.scrollTop = chatHistory.scrollHeight;

            try {
                // 2. Send POST request to your FastAPI backend
                // NOTE: Make sure your FastAPI has CORS configured if testing from a local file!
                const response = await fetch('http://localhost:8000/api/v1/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    // Matching your ChatRequest Pydantic model
                    body: JSON.stringify({ 
                        message: text,
                        symptoms: [] // Pass empty array for now, or hardcode ["Acne"] to test graph
                    })
                });

                if (!response.ok) throw new Error("Backend error");

                const data = await response.json();

                // 3. Display Bot Response (Text + Image)
                appendBotMessage(data.response, data.image_url);

            } catch (error) {
                console.error('Error:', error);
                appendMessage("Oops! Couldn't connect to the server. Is FastAPI running?", 'bot');
            } finally {
                // Hide loading
                loadingIndicator.style.display = 'none';
            }
        }

        function appendMessage(text, sender) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${sender}`;
            msgDiv.textContent = text;
            chatHistory.appendChild(msgDiv);
            chatHistory.scrollTop = chatHistory.scrollHeight;
        }

        // --- HOW THE IMAGE IS LOADED ---
        function appendBotMessage(text, imageUrl) {
            const msgDiv = document.createElement('div');
            msgDiv.className = 'message bot';
            
            // Add the text
            const textSpan = document.createElement('span');
            // Note: In production, you'd use a Markdown parser here since Gemini returns **bold** text
            textSpan.textContent = text; 
            msgDiv.appendChild(textSpan);

            // If the backend sent an image URL, create an HTML image tag
            if (imageUrl) {
                const img = document.createElement('img');
                img.className = 'bot-image';
                img.src = imageUrl; // The browser automatically downloads and renders this link
                img.alt = "Lifestyle visual";
                
                // Add the image below the text
                msgDiv.appendChild(img);
            }

            chatHistory.appendChild(msgDiv);
            chatHistory.scrollTop = chatHistory.scrollHeight;
        }
    </script>
</body>
</html>
